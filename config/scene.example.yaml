# Physical layout shared by the simulator and the backend.
# Frame: robot_base (x forward, y left, z up; meters, radians).
# Every value here is an EXAMPLE or ESTIMATE until you measure your real setup.
# Copy to config/scene.local.yaml (git-ignored) to override.

tray:
  width_m: 0.40          # interior, along tray x (image right)
  depth_m: 0.30          # interior, along tray y (image up)
  wall_height_m: 0.03
  # Pose of the tray frame origin (inner corner at the image's bottom-left) in robot_base.
  # This IS T_robot_from_tray. Measure it on the real rig.
  pose_in_robot: {x_m: 0.30, y_m: -0.15, z_m: 0.0, yaw_rad: 0.0}

reject_bin:
  center_in_robot: {x_m: 0.05, y_m: 0.45}
  inner_size_m: [0.20, 0.20]
  wall_height_m: 0.08

salt_proxy:
  count: 20
  half_size_m: [0.016, 0.013, 0.0125]   # ESTIMATED: ~3.2 x 2.6 x 2.5 cm chunk (from sample images)
  mass_kg: 0.035                        # ESTIMATED: rock salt ~2.16 g/cm^3
  friction: 1.0                         # ESTIMATED

robot:
  pregrasp_clearance_m: 0.08            # above the top of the tallest plausible chunk
  lift_height_m: 0.20                   # TCP height above tray surface while transferring
  release_height_m: 0.22                # TCP height above bin floor when opening
  max_joint_speed_rad_s: 1.0
  pick_timeout_s: 40.0
