[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saltsort-digital-twin"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Direct dependencies; exact working versions are pinned in requirements.lock.txt.
dependencies = [
  "mujoco",
  "numpy",
  "opencv-python",
  "onnxruntime",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["backend", "simulator", "common"]
include = ["app*", "saltsim*", "saltsort_common*"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "backend/tests", "simulator/tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
